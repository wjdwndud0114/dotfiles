# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'
set -g @plugin 'ofirgall/tmux-window-name'


# tmux-window-name cofig
set -g @tmux_window_dir_programs "['nvim', 'vim', 'vi', 'git']"

set -g prefix C-b

# Set tmux to vi mode
set-window-option -g mode-keys vi

# Add truecolor support
set -s default-terminal xterm-256color-italic
set-option -ga terminal-overrides ",xterm-256color-italic:Tc"
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
# Advertise truecolor to programs in panes (SSH/tmux don't forward COLORTERM),
# so apps like Claude Code emit 24-bit RGB instead of quantizing to 256 colors.
set-environment -g COLORTERM truecolor

# Forward OSC 8 hyperlinks (clickable links from Claude Code, etc). tmux only
# emits its Hls capability if the client advertises `hyperlinks`, and tmux 3.4
# has no ghostty entry in its feature table, so declare it for all terminals.
set -as terminal-features ",*:hyperlinks"

# Use 'y' as copy
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind-key v split-window -h
bind-key s split-window -v
# prefix+s is taken by the split above, so bind the session picker (tmux's
# default prefix+s = choose-tree -Zs, opened at the session list) to prefix+S.
bind-key S choose-tree -Zs
# Restore last-session toggle: our 'L' binding below shadows tmux's default
# prefix+L (switch-client -l). prefix+M-l is taken by resize-pane -R below, so
# put last-session on prefix+Tab (unbound by default; mnemonic "flip back").
bind-key Tab switch-client -l

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# Enable mouse support: scroll wheel scrolls scrollback, click selects pane/window
set -g mouse on

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Session-count override for the onedark status bar.
# The theme hardcodes a grey widget box around ${onedark_widgets} in
# status-right, so setting @onedark_widgets empty still leaves an empty grey
# box. Instead we re-set status-right here (AFTER tpm loads the theme) with
# the whole grey box wrapped in a conditional: shown as ' ⧉ N ' only when
# more than one session exists, and fully collapsed (date -> hostname, no box)
# when solo. Faithful to the theme's colors/separators otherwise; commas
# inside #[...] within the conditional are escaped as #,.
set -g status-right "#[fg=#aab2bf,bg=#282c34,nounderscore,noitalics]%R  %d/%m/%Y #{?#{e|>:#{server_sessions},1},#[fg=#3e4452#,bg=#282c34]#[fg=#aab2bf#,bg=#3e4452] ⧉ #{server_sessions} #[fg=#98c379#,bg=#3e4452],#[fg=#98c379#,bg=#282c34]}#[fg=#282c34,bg=#98c379,bold] #h #[fg=#e5c07b, bg=#98c379]#[fg=#e06c75,bg=#e5c07b]"
