
[env]
TERM = "xterm-256color-italic"

[font]
size = 15.5

[font.normal]
family = "RobotoMono Nerd Font"
style = "Regular"

[scrolling]
history = 10000

[selection]
save_to_clipboard = true
semantic_escape_chars = ''',│`|:"' ()[]{}<>'''

[window]
decorations = "full"

[general]
live_config_reload = true

# Color scheme — `alatheme` switches this line; `alatheme` with no argument
# opens a picker showing each theme's full palette. live_config_reload repaints
# open windows on save. Most themes come from github.com/alacritty/alacritty-
# theme; ember comes from github.com/ember-theme/alacritty.
import = ["~/.config/alacritty/themes/ember-soft.toml"]
